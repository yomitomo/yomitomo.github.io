<style>

const KEY = "yomitomo-site-lang";
const store = { get() { try { return localStorage.getItem(KEY); } catch (e) { return null; } }, set(v) { try { localStorage.setItem(KEY, v); } catch (e) {} } };
function apply(lang) {
  const t = T[lang] || T.ko;
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : lang;
  document.body.classList.toggle("zh", lang === "zh");
  document.title = t.title;
  const D = { ko: "모르는 일본어 단어를 톡 하면 읽는 법, 한국어 뜻, JLPT 급수가 바로 떠요. 사파리·크롬·PDF·Word에서 쓰는 무료 일본어 읽기 도우미. 아이폰·맥 앱, 윈도우는 크롬.",
    en: "Tap or hover any Japanese word to see its reading, English meaning and JLPT level. A free Japanese reading helper for Safari, Chrome, PDF and Word on iPhone, Mac and Windows.",
    zh: "不會的日文單字點一下，就能看到讀音、中文意思和 JLPT 級數。免費的日文閱讀小幫手，支援 Safari、Chrome、PDF、Word，iPhone、Mac、Windows 都能用。" };
  const md = document.getElementById("metaDesc"); if (md) md.content = D[lang] || D.ko;
  const A = { ko: { tap: "단어를 톡 하면 뜻이 뜨는 화면", chrome: "크롬에서 마우스를 올리면 뜻이 뜨는 화면", pdf: "PDF 파일에서 뜻을 보는 화면", review: "저장한 단어 복습 화면", kanji: "상용한자 공부 화면" },
    en: { tap: "Tap a word to see its meaning", chrome: "Hover a word in Chrome to see its meaning", pdf: "Reading a PDF with meanings", review: "Reviewing saved words", kanji: "Studying common kanji" },
    zh: { tap: "點一下單字就出現意思", chrome: "在 Chrome 把滑鼠移到單字上看意思", pdf: "在 PDF 裡查看意思", review: "複習已存的單字", kanji: "學習常用漢字" } };
  document.querySelectorAll("[data-img]").forEach((el) => { const a = (A[lang] || A.ko)[el.dataset.img]; if (a) el.alt = a; });
  document.querySelectorAll("[data-i]").forEach((el) => { const v = t[el.dataset.i]; if (v != null) el.innerHTML = v; });
  document.querySelectorAll("[data-img]").forEach((el) => { el.src = `img/${el.dataset.img}-${lang}.jpg`; });
  const p = document.getElementById("privacy"); p.textContent = t.privacy; p.href = t.privacyHref;
}
const gate = document.getElementById("gate");
const device = /^ko/i.test(navigator.language || "") ? "ko" : /^zh/i.test(navigator.language || "") ? "zh" : "en";
function openGate() {
  gate.querySelectorAll("button").forEach((b) => b.classList.toggle("main", b.dataset.lang === (store.get() || device)));
  gate.hidden = false; (gate.querySelector("button.main") || gate.querySelector("button")).focus();
}
gate.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { store.set(b.dataset.lang); apply(b.dataset.lang); gate.hidden = true; }));
gate.addEventListener("click", (e) => { if (e.target === gate && store.get()) gate.hidden = true; });
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !gate.hidden && store.get()) gate.hidden = true; });
document.getElementById("langBtn").addEventListener("click", openGate);
const forced = new URLSearchParams(location.search).get("lang");
if (forced && T[forced]) { store.set(forced); apply(forced); }
else if (store.get() && T[store.get()]) apply(store.get());
else { apply(device); if (!/bot|crawl|spider|slurp|preview/i.test(navigator.userAgent || "")) openGate(); }
